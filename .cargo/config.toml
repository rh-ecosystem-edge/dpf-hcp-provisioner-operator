# Static binaries: `cargo build --release --target x86_64-unknown-linux-musl`.
# ring's C/asm sources are freestanding, so the host gcc can compile them for musl when
# no musl cross compiler is installed.
[env]
CC_x86_64_unknown_linux_musl = { value = "gcc", force = false }
CC_aarch64_unknown_linux_musl = { value = "aarch64-linux-gnu-gcc", force = false }

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-unknown-linux-musl]
linker = "aarch64-linux-gnu-gcc"
rustflags = ["-C", "target-feature=+crt-static"]
