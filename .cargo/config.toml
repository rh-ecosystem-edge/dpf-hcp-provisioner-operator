# Static binaries: `cargo build --release --target x86_64-unknown-linux-musl`.
# ring's C/asm sources are freestanding, so the host gcc can compile them for musl when
# no musl cross compiler is installed (e.g. on Fedora/RHEL hosts). Inside the musl-native
# builder image (Containerfile) these settings are not needed.
[env]
CC_x86_64_unknown_linux_musl = { value = "gcc", force = false }

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]
