[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
kube = { version = "5.0.0", default-features = false, features = ["client", "runtime", "rustls-tls", "ring", "ws"] }
k8s-openapi = { version = "0.29.0", features = ["v1_35"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
