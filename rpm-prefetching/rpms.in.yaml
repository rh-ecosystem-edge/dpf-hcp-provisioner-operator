# Build-time RPMs for the operator image builder stage (Containerfile), prefetched for
# hermetic Konflux builds. rpms.lock.yaml is generated by ./generate-lock.sh (see its header).
packages:
  - rust
  - cargo
  - gcc
  - glibc-static
contentOrigin:
  repofiles: ["./ubi.repo"]
arches:
  - aarch64
  - x86_64
