# Production deployment values for DPF-HCP Provisioner Operator
# Use this file for production environments with higher resource requirements
# and multiple BlueField image mappings

# Operator image configuration
# For an actual production release, values.yaml itself must be flipped to the
# registry.redhat.io image/tag before the release commit is built (see RELEASING.md --
# the Konflux release pipeline only copies bytes, it does not rewrite chart content).
# Uncomment below only if you need to test against a specific released image locally.
image:
  # repository: registry.redhat.io/dpu-kit-for-nvidia/dpf-hcp-provisioner-rhel10-operator
  # tag: "4.22"
  pullPolicy: IfNotPresent

# High availability - 2 replicas with leader election
replicaCount: 2

# Production namespace
namespace: dpf-hcp-provisioner-system

# Service account
serviceAccount:
  name: dpf-hcp-provisioner-operator-controller-manager
  annotations: {}

# Production resource limits
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 256Mi

# Info level logging for production
logLevel: info

# DPFHCPProvisionerConfig CR (operator-wide configuration)
provisionerConfig: {}

# Leader election enabled for HA
leaderElection:
  enabled: true

# Health probe configuration
healthProbe:
  port: 8081
  livenessProbe:
    initialDelaySeconds: 15
    periodSeconds: 20
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10

# Security contexts
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - "ALL"

# Run operator on master nodes
nodeSelector:
  node-role.kubernetes.io/master: ""

# Tolerate master node taints
tolerations:
  - key: "node-role.kubernetes.io/master"
    operator: "Exists"
    effect: "NoSchedule"

# Spread across zones for HA
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: control-plane
                operator: In
                values:
                  - controller-manager
          topologyKey: topology.kubernetes.io/zone

# Pod annotations
podAnnotations:
  kubectl.kubernetes.io/default-container: manager

# Namespace labels
namespaceLabels:
  control-plane: controller-manager
  app.kubernetes.io/name: dpf-hcp-provisioner-operator
  app.kubernetes.io/managed-by: Helm
  environment: production

# Common labels for all resources
commonLabels:
  environment: production
  team: edge-infrastructure

# Common annotations
commonAnnotations:
  managed-by: "Red Hat Edge Infrastructure Team"
