# Default values for dpf-hcp-provisioner-operator
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Override the chart name used in app.kubernetes.io/name labels
nameOverride: dpf-hcp-provisioner-operator

# Operator image configuration
#
# This repository points at the Konflux dev build for this branch. It is intentionally
# committed here so that `helm upgrade --install` works out of the box without needing
# --set image.repository/image.tag.
#
# The tag is intentionally left empty: it falls back to .Chart.AppVersion (see below and
# templates/_helpers.tpl). Konflux's build-helm-chart-oci-ta task automatically packages
# this chart with `--app-version <commit-sha>`, so every chart pushed to the OCI registry
# already has the correct commit-sha tag baked in for that build, with no manual step
# required.
#
# IMPORTANT: the Konflux release pipeline that ships this chart to registry.redhat.io only
# relocates/retags the already-built chart artifact (byte-for-byte copy) -- it does NOT
# rewrite this file's content. So the repository/tag below must already be the production
# values at the exact commit that gets selected for release. See RELEASING.md for the
# (manual) two-step procedure: flip these values to registry.redhat.io before cutting a
# release, then flip them back to the dev image afterwards for continued development.
image:
  # Repository for the operator image (Konflux dev build for this branch)
  repository: quay.io/redhat-user-workloads/dpu-kit-for-nvidia-operator-tenant/dpf-hcp-provisioner-rhel10-operator
  # Image tag. Empty means: use .Chart.AppVersion (set to the commit SHA at chart-package time).
  # Override with --set image.tag=... to pin to a specific build.
  tag: ""
  # Image digest (when set, takes precedence over tag for immutable deployments)
  # Example: sha256:abc123...
  digest: ""
  # Image pull policy
  pullPolicy: IfNotPresent

# Number of operator replicas (1 for leader election)
replicaCount: 1

# Namespace where the operator will be deployed
namespace: dpf-hcp-provisioner-system

# Service account configuration
serviceAccount:
  # Name of the service account
  # Leave empty to auto-generate from release name (recommended for consistency)
  # Example: release name "dpf-hcp-provisioner-operator" → ServiceAccount "dpf-hcp-provisioner-operator"
  name: ""
  # Annotations to add to the service account
  annotations: {}

# Resource limits and requests for the operator pod
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Log level for the operator (debug, info, error)
logLevel: info

# DPFHCPProvisionerConfig CR (operator-wide configuration)
# Created as a post-install/post-upgrade helm hook after CRDs are established.
provisionerConfig: {}
  # Example overrides (uncomment to customize):
  # blueFieldOCPLayerRepo: "quay.io/eelgaev/rhcos-bfb"
  # disableMetalLB: true  # Set to true for cloud platforms (AWS, Azure, GCP) with native LoadBalancer support

# Leader election configuration
leaderElection:
  # Enable leader election (required for HA)
  enabled: true

# Health probe configuration
healthProbe:
  # Port for health probes
  port: 8081
  # Liveness probe configuration
  livenessProbe:
    initialDelaySeconds: 15
    periodSeconds: 20
  # Readiness probe configuration
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10

# Security context for the operator pod
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# Security context for the operator container
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - "ALL"

# Operator pod placement configuration
placement:
  # Target node type for operator deployment
  # Valid values: master, worker, custom
  # - master: Deploy on control plane nodes (default)
  # - worker: Deploy on worker nodes
  # - custom: Use custom nodeSelector/tolerations/affinity below
  #
  # Examples:
  #   Deploy on masters (default):
  #     helm install dpf-hcp-provisioner ./helm/dpf-hcp-provisioner-operator
  #   Deploy on workers:
  #     helm install dpf-hcp-provisioner ./helm/dpf-hcp-provisioner-operator --set placement.target=worker
  #   Deploy with custom placement:
  #     helm install dpf-hcp-provisioner ./helm/dpf-hcp-provisioner-operator --set placement.target=custom \
  #       --set nodeSelector.custom-label=custom-value
  target: master

# Node selector for operator pod placement (only used when placement.target=custom)
# When using master/worker presets, this is automatically configured
nodeSelector: {}

# Tolerations for operator pod placement (only used when placement.target=custom)
# When using master/worker presets, this is automatically configured
tolerations: []

# Affinity rules for operator pod placement (only used when placement.target=custom)
affinity: {}

# Pod annotations
podAnnotations:
  kubectl.kubernetes.io/default-container: manager

# Additional labels to apply to all resources
commonLabels: {}

# Additional annotations to apply to all resources
commonAnnotations: {}
