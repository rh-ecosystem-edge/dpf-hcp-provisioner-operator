[package]
name = "ctrlrt-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Runtime half of controller-runtime: real API client, informer cache, controllers, work queue, manager, leader election, health probes"

[dependencies]
ctrlrt = { path = "../ctrlrt" }
kube.workspace = true
k8s-openapi.workspace = true
tokio.workspace = true
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
anyhow.workspace = true
futures.workspace = true
chrono.workspace = true
http = "1.5.0"
http-body-util = "0.1.5"
bytes = "1.12.1"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "server-graceful", "http1"] }
tower = { version = "0.5.3", default-features = false }
form_urlencoded = "1.2.2"
prometheus = { version = "0.14.0", default-features = false, features = ["process"] }
uuid = { version = "1.28.0", features = ["v4"] }
hostname = "0.4.2"
fastrand = "2.5.0"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
ctrlrt-envtest = { path = "../ctrlrt-envtest" }
