[package]
name = "ctrl-ignitiongenerator"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ctrlrt = { path = "../ctrlrt" }
apis = { path = "../apis" }
common = { path = "../common" }
ignition = { path = "../ignition" }
gocompat = { path = "../gocompat" }
ctrl-hostedcluster = { path = "../ctrl-hostedcluster" }
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
k8s-openapi.workspace = true
reqwest = { version = "0.13.1", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.31", default-features = false, features = ["ring", "std", "tls12", "logging"] }

[dev-dependencies]
ctrlrt-fake = { path = "../ctrlrt-fake" }
rcgen = { version = "0.14.5", default-features = false, features = ["crypto", "pem", "ring"] }
tokio-rustls = { version = "0.26.2", default-features = false, features = ["ring", "tls12", "logging"] }
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
bytes = "1.10.1"
