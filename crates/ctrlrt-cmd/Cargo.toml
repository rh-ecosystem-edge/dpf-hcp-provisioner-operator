[package]
name = "ctrlrt-cmd"
description = "Process-level pieces of controller-runtime / Go stdlib used by cmd/main.go: Go flag parsing, zap logging, metrics server, cert watcher, event recorder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ctrlrt = { path = "../ctrlrt" }
k8s-openapi.workspace = true
tokio.workspace = true
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
futures.workspace = true
hyper = { version = "1.7", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.17", features = ["tokio", "server", "server-graceful", "http1", "http2"] }
http-body-util = "0.1.3"
bytes = "1.10"
rustls = { version = "0.23.31", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26.2", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.14.5", default-features = false, features = ["crypto", "pem", "ring"] }
ring = "0.17.14"
prometheus = { version = "0.14.0", default-features = false, features = ["process"] }
base64 = "0.22.1"
flate2 = { version = "1.1.2", default-features = false, features = ["rust_backend"] }
notify = { version = "8.2.0", default-features = false }
time = "0.3.41"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
