[package]
name = "registry"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Rust port of the go-containerregistry subset used by the operator (name, authn, remote, mutate.Extract)"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7.18", features = ["io", "io-util", "rt"] }
futures.workspace = true
bytes = "1.10.1"
http = "1.3.1"
reqwest = { version = "0.13.1", default-features = false, features = ["rustls-no-provider", "http2", "stream", "socks"] }
rustls = { version = "0.23.31", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8.1"
url = "2.5.4"
sha2 = "0.10.9"
hex = "0.4.3"
flate2 = { version = "1.1.2", default-features = false, features = ["rust_backend"] }
ruzstd = "0.8.1"
rand = "0.9.2"

[dev-dependencies]
axum = { version = "0.8.4", default-features = false, features = ["http1", "tokio"] }
flate2 = { version = "1.1.2", default-features = false, features = ["rust_backend"] }
tokio = { workspace = true }
